[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apix"
version = "0.1.0"
description = "Airfare Price Index — a multi-agent pipeline for Indian domestic airfare data collection, harmonization, and economic indexing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Viraj"},
]

dependencies = [
    # Async browser automation
    "playwright>=1.40",
    # Web framework
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    # Validation
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Data processing
    "pandas>=2.1",
    "numpy>=1.26",
    # Scheduling
    "apscheduler>=3.10",
    # Config
    "pyyaml>=6.0",
    # HTTP (for API calls, VLM, robots.txt)
    "httpx>=0.25",
    # Visualization
    "plotly>=5.18",
    "streamlit>=1.29",
    # Structured logging
    "structlog>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apix*"]
exclude = ["alembic*", "tests*"]

